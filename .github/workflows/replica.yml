name: Replica Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: '要修改的APK直链（修改版）'
        required: true
      original_url:
        description: '原版APK直链（提取签名+作为assets原包），留空则用 input 自己'
        required: false
        default: ''
      so_name:
        description: 'native库名（不含lib前缀）'
        required: false
        default: 'k'
      asset_dir:
        description: 'assets子目录'
        required: false
        default: 'SginatareKiler'
      asset_name:
        description: 'assets里的原包APK文件名'
        required: false
        default: '0rigih.apk'
      files_dir:
        description: '释放目录（相对 /data/data/<pkg>/）'
        required: false
        default: 'files/k'
      output_name:
        description: '输出APK文件名'
        required: false
        default: 'output.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replica branch
        uses: actions/checkout@v4
        with:
          ref: replica

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download tools
        run: |
          mkdir -p tools
          curl -L -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L -o tools/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar

      - name: Download input APK
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          echo "Downloading input APK..."
          curl -fL --retry 3 -o input.apk "$INPUT_URL" || { echo "download failed"; exit 1; }
          ls -la input.apk

      - name: Download original APK (if provided)
        if: ${{ inputs.original_url != '' }}
        env:
          ORIGINAL_URL: ${{ inputs.original_url }}
        run: |
          echo "Downloading original APK..."
          curl -fL --retry 3 -o original.apk "$ORIGINAL_URL" || { echo "download failed"; exit 1; }
          ls -la original.apk
          echo "ORIGINAL_APK=original.apk" >> $GITHUB_ENV

      - name: Set original to input when not provided
        if: ${{ inputs.original_url == '' }}
        run: echo "ORIGINAL_APK=input.apk" >> $GITHUB_ENV

      - name: Test apkanalyzer
        run: |
          which apkanalyzer || find "$ANDROID_HOME" -name apkanalyzer -type f 2>/dev/null | head -5
          APK=$(which apkanalyzer 2>/dev/null || find "$ANDROID_HOME" -name apkanalyzer -type f 2>/dev/null | head -1)
          echo "APKANALYZER=$APK"
          if [ -n "$APK" ]; then
            "$APK" manifest print input.apk | head -100
          else
            echo "apkanalyzer not found"
            ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true
          fi

      - name: Run build
        env:
          INPUT_APK: input.apk
          ORIGINAL_APK: ${{ env.ORIGINAL_APK }}
          OUTPUT_APK: ${{ inputs.output_name }}
          SO_NAME: ${{ inputs.so_name }}
          ASSET_DIR: ${{ inputs.asset_dir }}
          ASSET_NAME: ${{ inputs.asset_name }}
          FILES_DIR: ${{ inputs.files_dir }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          echo "ORIGINAL_APK=$ORIGINAL_APK"
          ls -la input.apk original.apk 2>&1 || true
          python3 -u tools/build.py 2>&1
          echo "EXIT=$?"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output.apk
          if-no-files-found: ignore
