name: Replica Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: '输入APK直链（HTTP/HTTPS）'
        required: true
      so_name:
        description: 'native库名（不含lib前缀）'
        required: false
        default: 'k'
      asset_dir:
        description: 'assets子目录'
        required: false
        default: 'SginatareKiler'
      asset_name:
        description: 'assets里的原包APK文件名'
        required: false
        default: '0rigih.apk'
      files_dir:
        description: '释放目录（相对 /data/data/<pkg>/）'
        required: false
        default: 'files/k'
      output_name:
        description: '输出APK文件名'
        required: false
        default: 'output.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout replica branch
        uses: actions/checkout@v4
        with:
          ref: replica

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download tools
        run: |
          mkdir -p tools
          curl -L -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -L -o tools/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar

      - name: Download APK
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          echo "Downloading APK..."
          curl -fL --retry 3 -o input.apk "$INPUT_URL" || { echo "download failed"; exit 1; }
          ls -la input.apk

      - name: Run build
        env:
          INPUT_APK: input.apk
          OUTPUT_APK: ${{ inputs.output_name }}
          SO_NAME: ${{ inputs.so_name }}
          ASSET_DIR: ${{ inputs.asset_dir }}
          ASSET_NAME: ${{ inputs.asset_name }}
          FILES_DIR: ${{ inputs.files_dir }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          python3 -u tools/build.py 2>&1
          echo "EXIT=$?"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output.apk
          if-no-files-found: ignore
