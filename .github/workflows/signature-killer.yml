name: Build Signature Killer

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'signature-killer/**'
      - 'process_apk.py'
      - '.github/workflows/signature-killer.yml'
  workflow_dispatch:
    inputs:
      apk_url:
        description: '输入 APK 直链 URL（仅 workflow_dispatch 使用；push 触发时自动跳过处理）'
        required: false
        type: string
      mode:
        description: '处理模式: dexonly(默认,不动资源/manifest) 或 apktool(需改资源时)'
        required: false
        default: 'dexonly'
        type: string
      dedup:
        description: '数据复用优化（默认关闭）：删除 assets/SignedByRS/input.apk 副本，产物≈原包大小。开启后 killer 能力降级：OriginApkCache.prepare() 取不到 input.apk，init() 全链（killOpen xhook / redirectApkPaths / killPM / PmProxy）提前 return，native 直读、maps 清洗、路径重定向等会新增多处无法过签；追求最强过签请保持关闭'
        required: false
        default: 'false'
        type: boolean

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept licenses and install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "build-tools;34.0.0" "platforms;android-34" "ndk;27.0.11902837" >/dev/null || true

      - name: Set up apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          echo "APKTOOL_JAR=$PWD/apktool.jar" >> "$GITHUB_ENV"

      - name: Set up baksmali + smali
        run: |
          wget -q https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar -O baksmali.jar
          wget -q https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar -O smali.jar

      - name: Build killer module
        working-directory: signature-killer
        run: ./gradlew :killer:assembleRelease --stacktrace

      - name: Prepare killer payload
        working-directory: signature-killer
        run: |
          set -e
          mkdir -p work_killer
          unzip -o -q killer/build/outputs/aar/killer-release.aar classes.jar -d work_killer
          unzip -o -q killer/build/outputs/aar/killer-release.aar 'jni/*' -d work_killer
          HIDDEN=$(find ~/.gradle/caches/modules-2/files-2.1/org.lsposed.hiddenapibypass -name '*.jar' 2>/dev/null | head -1)
          if [ -z "$HIDDEN" ]; then
            echo "hiddenapibypass not in gradle cache, downloading AAR 6.1..."
            mkdir -p work_killer/hiddenapibypass
            curl -fL --retry 3 -sS -o work_killer/hiddenapibypass.aar \
              https://repo.maven.apache.org/maven2/org/lsposed/hiddenapibypass/hiddenapibypass/6.1/hiddenapibypass-6.1.aar
            unzip -o -q work_killer/hiddenapibypass.aar classes.jar -d work_killer/hiddenapibypass
            HIDDEN=work_killer/hiddenapibypass/classes.jar
          fi
          echo "HIDDEN_JAR=$HIDDEN"
          "$ANDROID_HOME/build-tools/34.0.0/d8" \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output work_killer \
            work_killer/classes.jar "$HIDDEN"
          java -jar ../baksmali.jar d work_killer/classes.dex -o work_killer/smali
          mkdir -p work_killer/lib
          cp -r work_killer/jni/* work_killer/lib/
          echo "SO_CHECK_START"
          for so in work_killer/lib/*/libSignedByRS.so; do
            echo "=== $so ==="
            strings "$so" | grep -F '/data/app/' >/dev/null && echo "SO_HAS_DATA_APP=YES" || echo "SO_HAS_DATA_APP=NO"
            strings "$so" | grep -F 'shown_path' >/dev/null && echo "SO_HAS_SHOWN_PATH=YES" || echo "SO_HAS_SHOWN_PATH=NO"
          done
          echo "SO_CHECK_END"
          ls -l work_killer work_killer/lib/*/

      - name: Download input APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apk_url != ''
        working-directory: signature-killer
        run: |
          curl -fL --retry 3 -sS -o input.apk "${{ github.event.inputs.apk_url }}"
          ls -l input.apk

      - name: Run pipeline
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apk_url != ''
        working-directory: signature-killer
        env:
          APKTOOL_JAR: "${{ env.APKTOOL_JAR }}"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dexonly" ]; then
            python3 process_dex_only.py --apk input.apk \
              --apktool "$APKTOOL_JAR" --baksmali ../baksmali.jar \
              --smali ../smali.jar \
              --output work_out/processed_$(date +%Y%m%d_%H%M%S).apk \
              $([ "${{ github.event.inputs.dedup }}" = "true" ] && echo --dedup)
          else
            python3 process_apk.py --apk input.apk \
              $([ "${{ github.event.inputs.dedup }}" = "true" ] && echo --dedup)
          fi

      - name: Upload processed APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apk_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: processed-apk
          path: signature-killer/work_out/processed_*.apk
          retention-days: 14

      - name: Upload pipeline debug dump on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            signature-killer/work_out/pipeline.log
            signature-killer/work_out/decoded/AndroidManifest.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload killer AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: killer-aar
          path: signature-killer/killer/build/outputs/aar/*.aar
          retention-days: 14
