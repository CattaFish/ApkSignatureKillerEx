name: Replica Build

on:
  workflow_dispatch:
    inputs:
      original_apk:
        description: '原版APK文件名（仓库根目录），默认用 input.apk'
        required: false
        default: 'input.apk'
      so_name:
        description: 'native库名（不含lib前缀）'
        required: false
        default: 'k'
      asset_dir:
        description: 'assets子目录'
        required: false
        default: 'SginatareKiler'
      asset_name:
        description: '原包APK文件名'
        required: false
        default: '0rigih.apk'
      files_dir:
        description: '释放目录（相对 /data/data/<pkg>/）'
        required: false
        default: 'files/k'
      output_name:
        description: '输出APK文件名'
        required: false
        default: 'output.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          which aapt aapt2 d8 apksigner javac || true

      - name: Download tools
        run: |
          mkdir -p tools
          curl -L -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -L -o tools/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          ls -la tools/

      - name: Dump build.py for debug
        run: |
          echo "=== head ==="
          head -60 tools/build.py
          echo "=== tail ==="
          tail -30 tools/build.py

      - name: Run build
        env:
          INPUT_APK: input.apk
          ORIGINAL_APK: ${{ inputs.original_apk }}
          OUTPUT_APK: ${{ inputs.output_name }}
          SO_NAME: ${{ inputs.so_name }}
          ASSET_DIR: ${{ inputs.asset_dir }}
          ASSET_NAME: ${{ inputs.asset_name }}
          FILES_DIR: ${{ inputs.files_dir }}
        run: |
          export ANDROID_NDK_HOME="$(ls -d $ANDROID_HOME/ndk/* | head -1)"
          echo "NDK=$ANDROID_NDK_HOME"
          ls -la input.apk
          python3 -u tools/build.py 2>&1
          echo "EXIT=$?"

      - name: List results
        run: |
          ls -la output.apk 2>&1 || echo "no output.apk"
          find . -name "*.apk" -not -path "./tools/*" 2>/dev/null

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output.apk
          if-no-files-found: ignore
