name: Replica Build

on:
  workflow_dispatch:
    inputs:
      original_apk:
        description: '原版APK文件名（仓库根目录），默认用 input.apk'
        required: false
        default: 'input.apk'
      so_name:
        description: 'native库名（不含lib前缀）'
        required: false
        default: 'k'
      asset_dir:
        description: 'assets子目录'
        required: false
        default: 'SginatareKiler'
      asset_name:
        description: '原包APK文件名'
        required: false
        default: '0rigih.apk'
      files_dir:
        description: '释放目录（相对 /data/data/<pkg>/）'
        required: false
        default: 'files/k'
      output_name:
        description: '输出APK文件名'
        required: false
        default: 'output.apk'
  push:
    branches: [replica]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          which aapt aapt2 d8 apksigner || true

      - name: Download apktool & baksmali
        run: |
          mkdir -p tools
          curl -L -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -L -o tools/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          ls -la tools/*.jar

      - name: Sanity check build.py
        run: |
          python3 -c "import ast; ast.parse(open('tools/build.py').read()); print('[OK] build.py syntax valid')"
          grep -n "def compile_java_to_dex" tools/build.py
          grep -n "java_src" tools/build.py | head -5
          echo "---"
          ls -la input.apk

      - name: Run replica build
        env:
          INPUT_APK: input.apk
          ORIGINAL_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.original_apk || 'input.apk' }}
          OUTPUT_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.output_name || 'output.apk' }}
          SO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.so_name || 'k' }}
          ASSET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.asset_dir || 'SginatareKiler' }}
          ASSET_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.asset_name || '0rigih.apk' }}
          FILES_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.files_dir || 'files/k' }}
        run: |
          export ANDROID_NDK_HOME="$(ls -d $ANDROID_HOME/ndk/* | head -1)"
          echo "NDK=$ANDROID_NDK_HOME"
          echo "=== python3 build.py ==="
          python3 -u tools/build.py 2>&1
          echo "=== build.py exit: $? ==="

      - name: List workspace
        run: |
          echo "=== output.apk ==="
          ls -la output.apk 2>&1 || echo "output.apk NOT FOUND"
          echo "=== workspace root ==="
          ls -la
          echo "=== any apk anywhere ==="
          find . -name "*.apk" -not -path "./tools/*" 2>/dev/null | head -20

      - name: Upload output APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            output.apk
            *.log
            !tools/*.jar
          if-no-files-found: ignore
