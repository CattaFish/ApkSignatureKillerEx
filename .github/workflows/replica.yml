name: Replica Build

on:
  push:
    branches: [replica]
  workflow_dispatch:
    inputs:
      original_apk:
        description: '原版APK文件名（仓库根目录），默认用 input.apk'
        required: false
        default: 'input.apk'
      so_name:
        description: 'native库名（不含lib前缀）'
        required: false
        default: 'k'
      asset_dir:
        description: 'assets子目录'
        required: false
        default: 'SginatareKiler'
      asset_name:
        description: '原包APK文件名'
        required: false
        default: '0rigih.apk'
      files_dir:
        description: '释放目录（相对 /data/data/<pkg>/）'
        required: false
        default: 'files/k'
      output_name:
        description: '输出APK文件名'
        required: false
        default: 'output.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true
          which aapt aapt2 d8 apksigner javac || true

      - name: Download tools
        run: |
          mkdir -p tools
          curl -L -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -L -o tools/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          ls -la tools/

      - name: Set build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ORIGINAL_APK=${{ inputs.original_apk }}" >> $GITHUB_ENV
            echo "SO_NAME=${{ inputs.so_name }}" >> $GITHUB_ENV
            echo "ASSET_DIR=${{ inputs.asset_dir }}" >> $GITHUB_ENV
            echo "ASSET_NAME=${{ inputs.asset_name }}" >> $GITHUB_ENV
            echo "FILES_DIR=${{ inputs.files_dir }}" >> $GITHUB_ENV
            echo "OUTPUT_APK=${{ inputs.output_name }}" >> $GITHUB_ENV
          else
            echo "ORIGINAL_APK=input.apk" >> $GITHUB_ENV
            echo "SO_NAME=k" >> $GITHUB_ENV
            echo "ASSET_DIR=SginatareKiler" >> $GITHUB_ENV
            echo "ASSET_NAME=0rigih.apk" >> $GITHUB_ENV
            echo "FILES_DIR=files/k" >> $GITHUB_ENV
            echo "OUTPUT_APK=output.apk" >> $GITHUB_ENV
          fi
          echo "INPUT_APK=input.apk" >> $GITHUB_ENV

      - name: Run build
        run: |
          export ANDROID_NDK_HOME="$(ls -d $ANDROID_HOME/ndk/* | head -1)"
          echo "NDK=$ANDROID_NDK_HOME"
          echo "INPUT_APK=$INPUT_APK"
          echo "ORIGINAL_APK=$ORIGINAL_APK"
          echo "SO_NAME=$SO_NAME"
          echo "ASSET_DIR=$ASSET_DIR"
          echo "ASSET_NAME=$ASSET_NAME"
          echo "FILES_DIR=$FILES_DIR"
          echo "OUTPUT_APK=$OUTPUT_APK"
          ls -la input.apk
          python3 -u tools/build.py 2>&1
          echo "EXIT=$?"

      - name: List results
        run: |
          ls -la output.apk 2>&1 || echo "no output.apk"
          find . -name "*.apk" -not -path "./tools/*" 2>/dev/null

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output.apk
          if-no-files-found: ignore
